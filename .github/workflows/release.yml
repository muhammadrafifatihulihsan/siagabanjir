# Release otomatis SiagaBanjir — membuat GitHub Release dari tag
# Living document: pemeliharaan mengikuti rules/documentation.md

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  create-release:
    name: Buat GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buat Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          body: |
            ## Perubahan

            Lihat [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) untuk detail perubahan pada versi ini.

            ---
            _Release otomatis oleh GitHub Actions._
