# Living document: pemeliharaan mengikuti rules/documentation.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  create-release:
    name: Buat GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Ambil catatan versi dari CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -B -X utf8 .github/scripts/release_notes.py "$RELEASE_TAG" "$RUNNER_TEMP/siagabanjir-release-notes.md"

      - name: Buat Release
        uses: softprops/action-gh-release@v3
        with:
          name: SiagaBanjir ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/siagabanjir-release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
